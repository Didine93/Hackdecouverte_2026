
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Guard - Scanner sécurisé</title>

    <!-- Liaison avec le fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- En-tête -->
    <header>
        <div class="logo">
        <img src="./images/qr-logo.png" alt="Logo QR Guard" class="logo-img">            <h1>QR GUARD</h1>
        </div>
        <p>Votre protection contre les QR codes malveillants</p>
    </header>


    <!-- Contenu principal -->
    <main>

        <section class="scanner">

            <h2>Analysez votre QR code</h2>

            <p>
                Scannez un QR code pour vérifier
                si son contenu présente un risque.
            </p>

            <!-- Bouton de scan -->
            <button id="scanButton">
                Scanner un QR code
            </button>

            <!-- Affichage du résultat -->
            <div id="result">
                En attente d'un QR code...
            </div>

        </section>

    </main>


    <!-- Liaison avec le fichier JavaScript -->
    <script src="script.js"></script>

</body>

</html>
